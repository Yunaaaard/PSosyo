name: p_sosyo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  image_picker: ^0.8.7+4
  camera: 0.10.5+9
  get: ^4.6.6
  dotted_border: ^2.1.0
  google_mlkit_text_recognition: ^0.12.0
  google_mlkit_barcode_scanning: ^0.12.0
  image: ^4.0.17
  pdf: ^3.11.1
  path_provider: ^2.1.4
  confetti: ^0.8.0
  google_mlkit_face_detection: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: "IT TENOVIANA DEMO"
      fonts:
        - asset: assets/fonts/ITTENOVIANADEMO-Italic.otf
          weight: 400
        - asset: assets/fonts/ITTENOVIANADEMO-Regular.otf
          weight: 400

dependency_overrides:
  tflite_flutter: ^0.12.1

